<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setrise NSE</title>
<meta name="description" content="Rise with reasons. NSE stock scores with the reasons behind every rating.">
<meta name="theme-color" content="#F6F1E7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setrise">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-mark"><img class="sp-arrow" src="icons/splash-arrow.png" alt=""><span class="sp-shine"></span></div>
  <div class="sp-name">Setrise NSE</div>
  <div class="sp-motto">Rise with reasons.</div>
</div>
<script>
(function(){var s=document.getElementById('splash');if(!s)return;setTimeout(function(){s.classList.add('sp-out');setTimeout(function(){s.remove()},600)},2300)})();
</script>
<div class="app">
  <header class="top">
    <div class="dateline"><span id="dateline"></span><span>Nairobi Securities Exchange</span></div>
    <div class="brand">
      <div class="name">Setrise NSE</div>
      <div class="motto">Rise with reasons.</div>
    </div>
    <div id="asof" class="asof" aria-live="polite"></div>
  </header>
  <div id="banners"></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Main"></nav>
</div>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="legal.js"></script>
<script src="app.js"></script>
</body>
</html>
