<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setrise NASE</title>
<meta name="description" content="Rise with reasons. NSE stock scores with the reasons behind every rating.">
<meta name="theme-color" content="#0C2B33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setrise">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0F5C63"/><rect x="12" y="38" width="9" height="14" rx="2" fill="#7FD0D6"/><rect x="26" y="28" width="9" height="24" rx="2" fill="#7FD0D6"/><rect x="40" y="14" width="9" height="38" rx="2" fill="#F0A83A"/></svg>
      <div><div class="name">Setrise NASE</div><div class="motto">Rise with reasons.</div></div>
    </div>
    <div id="asof" class="asof" aria-live="polite"></div>
  </header>
  <div id="banners"></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Main">
    <button data-tab="screen" class="on"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2" /></svg><span>Screener</span></button>
    <button data-tab="watch"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Watchlist</span></button>
    <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6"/></svg><span>Account</span></button>
  </nav>
</div>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
